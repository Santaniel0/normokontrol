# Пример профиля кафедры. Берёт всё из ГОСТ 7.32-2017 и меняет только то,
# что написано в методичке. Значения здесь условные.
base = "gost-7.32-2017"
name = "Кафедра информационных систем, ВКР 2026"

[body]
# Методичка требует именно Times New Roman 14 пт и выравнивание по ширине.
font_required = true
size_pt = 14
align = "justify"

[structure]
# Реферат на кафедре не нужен, а список источников обязателен.
required = ["СОДЕРЖАНИЕ", "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ", "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"]

[rules]
# Список источников на кафедре упорядочивают по алфавиту, а не по ссылкам.
disable = ["refs.order"]
