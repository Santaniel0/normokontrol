# Профиль по ГОСТ 7.32-2017 «Отчет о научно-исследовательской работе.
# Структура и правила оформления». Каждое значение сверено с текстом
# стандарта, в комментарии указан пункт. Где ГОСТ оставляет решение
# организации, это сказано прямо, и значение не задано.
#
# Ноль или пустая строка означают «не проверять».
# Профиль кафедры удобнее делать наследником этого:
#     base = "gost-7.32-2017"
# и указывать только то, что отличается.

name = "ГОСТ 7.32-2017"

[page]
# 6.1.1: формат А4 по ГОСТ 9327, то есть 210 × 297 мм.
width_mm = 210
height_mm = 297
# 6.1.1: «левое — 30 мм, правое — 15 мм, верхнее и нижнее — 20 мм».
margin_left_mm = 30
margin_right_mm = 15
margin_top_mm = 20
margin_bottom_mm = 20
# Допуск ГОСТ не задаёт. 1 мм покрывает округление: Word хранит поля
# в двадцатых долях пункта.
tolerance_mm = 1

[body]
# 6.1.1: «Рекомендуемый тип шрифта для основного текста отчета —
# Times New Roman». Это рекомендация, поэтому другой шрифт даёт
# предупреждение. Вуз может сделать его обязательным: font_required = true.
font = "Times New Roman"
font_required = false
# 6.1.1: «размер шрифта — не менее 12 пт». Точный кегль ГОСТ не задаёт,
# его устанавливает организация (часто 14 пт): size_pt = 14.
min_size_pt = 12
size_pt = 0
# 6.1.1: отчёт выполняют «через полтора интервала».
line_spacing = 1.5
# 6.1.1: «Абзацный отступ должен быть одинаковым по всему тексту отчета
# и равен 1,25 см». Допуск ГОСТ не задаёт; 0,05 см — погрешность пересчёта.
first_line_indent_cm = 1.25
indent_tolerance_cm = 0.05
# Выравнивание основного текста ГОСТ 7.32-2017 не устанавливает, это
# решение организации. Пока значение не задано, проверяется только то,
# что весь основной текст выровнен одинаково. Варианты: left, center,
# right, justify.
align = ""

[structure]
# 6.2.1: наименования структурных элементов служат их заголовками.
# Порядок — как в перечне раздела 4.
order = [
  "СПИСОК ИСПОЛНИТЕЛЕЙ",
  "РЕФЕРАТ",
  "СОДЕРЖАНИЕ",
  "ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ",
  "ПЕРЕЧЕНЬ СОКРАЩЕНИЙ И ОБОЗНАЧЕНИЙ",
  "ВВЕДЕНИЕ",
  "ЗАКЛЮЧЕНИЕ",
  "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
]
# Раздел 4: обязательные элементы выделены полужирным — титульный лист,
# список исполнителей, реферат, содержание, введение, основная часть,
# заключение. Список исполнителей не оформляют, если исполнитель один
# (5.2.2). У титульного листа и основной части нет фиксированного
# заголовка, их здесь не проверить. Список источников по ГОСТ
# необязателен (раздел 4), но почти всегда обязателен по методичке вуза.
required = ["РЕФЕРАТ", "СОДЕРЖАНИЕ", "ВВЕДЕНИЕ", "ЗАКЛЮЧЕНИЕ"]
# Заголовок, после которого идёт список источников (6.16).
bibliography = ["СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"]

[captions]
# 6.5.4 и 6.6.4: сквозная нумерация рисунков и таблиц; 6.5.6 и 6.6.4
# допускают нумерацию в пределах раздела. "any" принимает оба способа,
# но требует, чтобы в документе был один. Варианты: any, continuous,
# by-section.
numbering = "any"

[rules]
# Идентификаторы правил, которые не нужно проверять. Список правил:
# normokontrol rules
disable = []
