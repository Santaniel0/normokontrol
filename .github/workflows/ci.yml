name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: |
          go build -o dist/normokontrol ./cmd/normokontrol
          GOOS=windows GOARCH=amd64 go build -o dist/normokontrol.exe ./cmd/normokontrol
